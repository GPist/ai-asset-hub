services:
  # ── Postgres: shared by Gitea ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gitea
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gitea_dev_password}
      POSTGRES_DB: gitea
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitea"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Gitea: headless VC engine ───────────────────────────────────────────────
  gitea:
    image: gitea/gitea:1.22
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Instance
      GITEA__DEFAULT__APP_NAME: "AI Asset Hub"
      GITEA__server__ROOT_URL: ${GITEA_PUBLIC_URL:-http://localhost:3001}
      GITEA__server__HTTP_PORT: "3001"
      GITEA__server__DOMAIN: ${GITEA_DOMAIN:-localhost}

      # Database
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: db:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD: ${POSTGRES_PASSWORD:-gitea_dev_password}

      # Security
      GITEA__security__SECRET_KEY: ${GITEA_SECRET_KEY:-changeme_secret_key_32chars_please}
      GITEA__security__INTERNAL_TOKEN: ${GITEA_INTERNAL_TOKEN:-changeme_internal_token}
      # Skip the install wizard — DB is configured via env, so the API/CLI work
      # immediately on first boot (the initial admin is created by setup.sh).
      GITEA__security__INSTALL_LOCK: "true"

      # Service: auto-register OIDC users, disable public registration
      GITEA__service__ENABLE_AUTO_REGISTRATION: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__SHOW_REGISTRATION_BUTTON: "false"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "true"

      # OAuth2 provider (Gitea acts as OIDC provider for the web app)
      GITEA__oauth2__ENABLE: "true"
      GITEA__oauth2__JWT_SECRET: ${GITEA_JWT_SECRET:-changeme_jwt_secret}

      # Commit signing: instance signs all merges
      GITEA__repository__signing__SIGNING_KEY: default
      GITEA__repository__signing__MERGES: always

      # Mailer (disabled for dev)
      GITEA__mailer__ENABLED: "false"

    ports:
      - "3001:3001"
      - "2222:22"
    volumes:
      - gitea-data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3001/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Bootstrap: seeds org, admin team, sample asset repo ────────────────────
  bootstrap:
    build:
      context: ./gitea
      dockerfile: Dockerfile.bootstrap
    depends_on:
      gitea:
        condition: service_healthy
    environment:
      GITEA_URL: ${GITEA_URL:-http://gitea:3001}
      GITEA_ADMIN_USER: ${GITEA_ADMIN_USER:-hubadmin}
      GITEA_ADMIN_PASSWORD: ${GITEA_ADMIN_PASSWORD:-hubadmin_changeme}
      GITEA_ADMIN_EMAIL: ${GITEA_ADMIN_EMAIL:-admin@example.com}
      HUB_ORG: ${HUB_ORG:-assets}
      HUB_ADMIN_TEAM: ${HUB_ADMIN_TEAM:-admins}
      WEB_CALLBACK_URL: ${NEXTAUTH_URL:-http://localhost:3000}/api/auth/callback/gitea
    restart: "no"

  # ── Web front-end ───────────────────────────────────────────────────────────
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      gitea:
        condition: service_healthy
    environment:
      # Internal URL for server-side API calls (container network)
      GITEA_URL: http://gitea:3001
      # Public URL for browser-facing OIDC redirect + git source links
      GITEA_PUBLIC_URL: ${GITEA_PUBLIC_URL:-http://localhost:3001}
      GITEA_ADMIN_TOKEN: ${GITEA_ADMIN_TOKEN}
      HUB_ORG: ${HUB_ORG:-assets}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-changeme_nextauth_secret}
      # OIDC client registered in Gitea by bootstrap
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-ai-asset-hub-web}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      CATALOG_DB: /data/catalog.db
    ports:
      - "3000:3000"
    volumes:
      - web-data:/data

  # ── Dex: demo OIDC provider (profile=demo only) ──────────────────────────
  dex:
    image: dexidp/dex:v2.40.0
    profiles: ["demo"]
    restart: unless-stopped
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "5556:5556"
    volumes:
      - ./gitea/dex-config.yaml:/etc/dex/config.yaml:ro

volumes:
  postgres-data:
  gitea-data:
  web-data:
