# Dex: demo OIDC provider for local development.
# Used only with `docker compose --profile demo up`.
# In production, replace with your real IdP (Keycloak, Okta, Entra, Google).

issuer: http://localhost:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

# Demo connector: static users, no real IdP needed
connectors:
  - type: mockCallback
    id: mock
    name: Demo Login

staticClients:
  # Gitea uses Dex as its upstream OIDC provider
  - id: gitea
    redirectURIs:
      - http://localhost:3001/user/oauth2/dex/callback
    name: Gitea
    secret: gitea-dex-secret

oauth2:
  skipApprovalScreen: true

staticPasswords:
  - email: "alice@example.com"
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
    username: "alice"
    userID: "08a8684b-db88-4b73-90a9-3cd1661f5466"
  - email: "bob@example.com"
    hash: "$2a$10$2b2cU8CPhOTaGrs1HRQuAueS7JTT5ZHsHSzYiFPm1leZck7Mc8T4W"
    username: "bob"
    userID: "08a8684b-db88-4b73-90a9-3cd1661f5467"
# Both passwords are: "password"
